
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e4ff">
<title>CoinOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   CoinOS – Design-Tokens
   Farben: Zuckerwatte-Wallpaper, Trauben-Tinte, Goldmünze
   Schrift: Bricolage Grotesque (Überschriften/Zahlen), Figtree (Text)
   ========================================================= */
:root{
  --ink:#2b1b4a; --muted:#6f6489; --line:rgba(43,27,74,.12);
  --surface:rgba(255,255,255,.82); --solid:#fff; --soft:rgba(43,27,74,.05);
  --primary:#7b5cff; --primary-2:#4b33d6;
  --accent:var(--primary); --accent-2:var(--primary-2);
  --gold:#ffc233; --gold-deep:#e59a00;
  --green:#12b886; --red:#e5384f; --amber:#f08c00; --blue:#1c7ed6;
  --font-head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 24px 60px -18px rgba(75,51,214,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--ink);background:#f3e4ff;overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;letter-spacing:-.01em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.grow{flex:1;min-width:0}
.ic{flex:none;display:block}

.wallpaper{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(900px 620px at 8% 8%,#ffc9e2 0%,transparent 62%),
    radial-gradient(800px 600px at 95% 12%,#c9e8ff 0%,transparent 60%),
    radial-gradient(900px 700px at 70% 105%,#ffe7b8 0%,transparent 58%),
    radial-gradient(700px 600px at 0% 100%,#d8ccff 0%,transparent 60%),
    #f3e4ff;}

/* ---------- Münz-Motiv ---------- */
.coin{display:inline-block;flex:none;width:1.15em;height:1.15em;border-radius:50%;position:relative;vertical-align:-.2em;
  background:radial-gradient(circle at 32% 28%,#fff1b8 0%,var(--gold) 45%,var(--gold-deep) 100%);
  box-shadow:0 1px 2px rgba(120,80,0,.45)}
.coin::after{content:"";position:absolute;inset:.2em;border-radius:50%;border:.11em solid rgba(150,90,0,.45)}

/* ---------- Buttons & Formulare ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:700;background:var(--solid);border:1.5px solid var(--line);transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{box-shadow:0 6px 16px -8px rgba(43,27,74,.5)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:7px 13px;font-size:.85rem}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.link{color:var(--primary-2);font-weight:600;text-decoration:underline;text-underline-offset:3px;margin-top:12px;display:block;width:100%;text-align:center}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:.85rem;font-weight:700;color:var(--muted)}
.field input,.field select,.search{width:100%;padding:12px 14px;border-radius:14px;background:var(--solid);border:1.5px solid var(--line)}
.field input:focus,.field select:focus,.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.check{display:flex;align-items:center;gap:10px;margin:4px 0 14px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.form-error{background:#ffe3e7;color:#a31629;padding:10px 12px;border-radius:12px;font-weight:600;margin-bottom:12px;font-size:.9rem}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--soft)}
.badge.red{background:#ffe3e7;color:#a31629}
.badge.blue{background:#dcebff;color:#0b4a94}
.badge.st-bestellt{background:#fff0d1;color:#8a5200}
.badge.st-gepackt{background:#dcebff;color:#0b4a94}
.badge.st-geliefert{background:#d3f5e8;color:#0a6c4b}
.price{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-family:var(--font-head);font-size:1.1rem}

/* ---------- Boot / Auth ---------- */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f3e4ff}
.spinner{width:44px;height:44px;border-radius:50%;border:5px solid rgba(123,92,255,.2);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#auth{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding:20px;overflow:auto}
.auth-card{width:min(420px,100%);background:var(--surface);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1.5px solid rgba(255,255,255,.9);border-radius:32px;padding:34px 28px;box-shadow:var(--shadow)}
.auth-logo{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;margin:0 auto 16px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:2rem;box-shadow:0 14px 30px -10px rgba(75,51,214,.7)}
.auth-logo .coin{width:38px;height:38px}
.auth-card h1{text-align:center;font-size:2.1rem;font-weight:800}
.auth-card>p{text-align:center;margin:6px 0 22px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:999px;margin-bottom:20px}
.tabs button{flex:1;padding:9px;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button.active{background:var(--solid);color:var(--ink);box-shadow:0 4px 12px -6px rgba(43,27,74,.5)}

/* ---------- OS-Layout ---------- */
#os{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#statusbar{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-top:env(safe-area-inset-top,0);background:rgba(255,255,255,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1.5px solid rgba(255,255,255,.85);position:relative;z-index:35}
.sb-left,.sb-right{display:flex;align-items:center;gap:14px}
.brand{font-family:var(--font-head);font-weight:800;font-size:1.25rem}
#clock{font-weight:600;font-size:.9rem}
.coin-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:linear-gradient(135deg,#fff3c4,#ffd569);border:1.5px solid rgba(229,154,0,.45);font-family:var(--font-head);font-weight:800;font-size:1.05rem;color:#5c3a00}
.coin-pill .coin{width:26px;height:26px}
.coin-pill.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.12)}100%{transform:scale(1)}}
#profileWrap{position:relative}
.avatar-btn,.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff7eb3,#7b5cff);flex:none}
#profileMenu{position:absolute;right:0;top:48px;width:250px;background:var(--solid);border-radius:20px;padding:16px;box-shadow:var(--shadow);border:1.5px solid var(--line);display:grid;gap:8px;z-index:60}
.pm-name{font-family:var(--font-head);font-weight:700;font-size:1.1rem}
#pmRole{justify-self:start;margin-bottom:6px}

#desktop{flex:1;overflow:auto;padding:34px 22px 130px;max-width:980px;width:100%;margin:0 auto}
#desktop h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800}
#dateLine{margin:4px 0 30px;font-weight:600;text-transform:none}
#appGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:26px 14px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px;border-radius:24px;transition:transform .15s}
.tile:hover{transform:translateY(-4px)}
.tile-icon{position:relative;width:84px;height:84px;border-radius:28px;display:grid;place-items:center;color:#fff;overflow:hidden;
  background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 16px 28px -14px var(--c2)}
.tile-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.tile-label{font-weight:700;font-size:.95rem;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:36;display:flex;gap:10px;padding:10px 14px;border-radius:30px;background:rgba(255,255,255,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.95);box-shadow:var(--shadow)}
.dock-btn{position:relative;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));transition:transform .15s}
.dock-btn:hover{transform:translateY(-5px) scale(1.06)}
.dock-btn.home{background:linear-gradient(145deg,#6f6489,#2b1b4a)}
.dock-btn.active::after{content:"";position:absolute;bottom:-8px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink)}

/* ---------- App-Fenster ---------- */
#window{position:fixed;z-index:30;top:72px;bottom:104px;left:50%;width:min(1060px,calc(100% - 24px));display:flex;flex-direction:column;border-radius:30px;overflow:hidden;
  background:rgba(255,255,255,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1.5px solid #fff;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transform:translateX(-50%) translateY(24px) scale(.97);transition:opacity .22s,transform .22s}
#window.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0) scale(1)}
.win-head{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent-2))}
.win-head h2{flex:1;display:flex;align-items:center;gap:10px;font-size:1.3rem;min-width:0}
.win-head h2 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head-btn{background:rgba(255,255,255,.2)!important;color:#fff!important;border:1.5px solid rgba(255,255,255,.4)!important;padding:8px 14px}
.head-btn:hover{background:rgba(255,255,255,.32)!important}
.head-spacer{width:1px}
.win-body{flex:1;overflow:auto;padding:22px}

#gameView{position:fixed;z-index:45;left:0;right:0;bottom:0;top:58px;display:flex;flex-direction:column;background:#fff}
#gameView iframe{flex:1;border:0;width:100%;background:#fff}
#gameView .win-head{padding-top:12px}

.panel{background:var(--solid);border:1.5px solid var(--line);border-radius:22px;padding:18px}
.panel h3{font-size:1.1rem;margin-bottom:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--soft);margin-bottom:9px;flex-wrap:wrap}
.row:last-child{margin-bottom:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis}
.empty{display:grid;place-items:center;gap:10px;text-align:center;padding:34px 16px;color:var(--muted);font-weight:600}
.empty .ic{opacity:.6}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 15px;border-radius:999px;font-weight:700;background:var(--solid);border:1.5px solid var(--line)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.thumb{position:relative;overflow:hidden;background:linear-gradient(135deg,#f4ecff,#ffe9d1);display:grid;place-items:center;color:var(--muted)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* Konto */
.balance{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:26px;border-radius:26px;color:#fff;background:linear-gradient(130deg,#12b886,#0a7d5c)}
.balance .lbl{font-weight:600;opacity:.9}
.balance .big{display:flex;align-items:center;gap:14px;font-family:var(--font-head);font-weight:800;font-size:clamp(2.6rem,9vw,4.4rem);line-height:1}
.balance .big .coin{width:.75em;height:.75em}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--font-head);font-size:1.6rem}
.stat span{font-size:.85rem;opacity:.9;font-weight:600}
.amt{font-family:var(--font-head);font-weight:800;font-size:1.05rem}
.amt.plus{color:var(--green)}
.amt.minus{color:var(--red)}

/* Shop */
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.item{display:flex;flex-direction:column;background:var(--solid);border:1.5px solid var(--line);border-radius:26px;overflow:hidden}
.item .thumb{aspect-ratio:4/3}
.item-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.item-body h4{font-size:1.15rem}
.item-foot{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px}
.stock{font-size:.82rem;font-weight:700;color:var(--muted)}
.stock.low{color:var(--amber)}
.stock.out{color:var(--red)}
.item-body .btn{margin-top:auto}

/* Spiele */
.game{display:flex;gap:14px;align-items:center;padding:14px;background:var(--solid);border:1.5px solid var(--line);border-radius:24px}
.game .thumb{width:72px;height:72px;border-radius:22px;flex:none}
.game-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.design-preview{min-height:150px;aspect-ratio:16/9}
.grid-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

/* Admin */
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabbar .chip{display:inline-flex;align-items:center;gap:8px}
.row .thumb{width:46px;height:46px;border-radius:14px;flex:none}
.row select{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--solid);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-family:var(--font-head)}

/* Modal / Toast */
#modalRoot{position:relative;z-index:80}
.modal-backdrop{position:fixed;inset:0;background:rgba(43,27,74,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--solid);border-radius:28px;padding:26px;box-shadow:0 30px 80px -20px rgba(43,27,74,.6);animation:pop .18s}
.modal h3{font-size:1.4rem;margin-bottom:6px}
.modal>p,.modal-text{margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
#toasts{position:fixed;z-index:90;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0));transform:translateX(-50%);display:grid;gap:10px;width:min(440px,calc(100% - 24px));pointer-events:none}
.toast{padding:13px 18px;border-radius:18px;font-weight:700;color:#fff;background:var(--ink);box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:pop .2s;pointer-events:auto}
.toast.error{background:var(--red)}
.toast.success{background:#0a7d5c}

@media (max-width:700px){
  .two-col{grid-template-columns:1fr}
  #window{top:62px;bottom:92px;width:100%;border-radius:26px 26px 0 0;border-bottom:0}
  .win-body{padding:16px}
  #clock{display:none}
  .grid-items{grid-template-columns:repeat(2,1fr);gap:12px}
  .item-body{padding:12px}
  #desktop{padding:24px 16px 130px}
  .tile-icon{width:76px;height:76px;border-radius:26px}
  .grid-games{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wallpaper"></div>

<div id="boot"><div class="spinner" role="status" aria-label="Lädt"></div></div>

<!-- ===================== LOGIN ===================== -->
<main id="auth" hidden>
  <div class="auth-card">
    <div class="auth-logo"><i class="coin"></i></div>
    <h1>CoinOS</h1>
    <p class="muted">Dein Konto, dein Shop, deine Apps.</p>
    <div class="tabs" id="authTabs">
      <button type="button" class="active" data-action="auth-tab" data-tab="login">Anmelden</button>
      <button type="button" data-action="auth-tab" data-tab="register" id="registerTab">Registrieren</button>
    </div>
    <form id="authForm">
      <label class="field" id="nameField" hidden><span>Name</span><input id="authName" autocomplete="name" placeholder="Dein Name"></label>
      <label class="field"><span>E-Mail</span><input id="authEmail" type="email" required autocomplete="email" placeholder="name@beispiel.de"></label>
      <label class="field"><span>Passwort</span><input id="authPass" type="password" required minlength="6" autocomplete="current-password" placeholder="Mindestens 6 Zeichen"></label>
      <p class="form-error" id="authError" hidden></p>
      <button class="btn primary block" id="authSubmit" type="submit">Anmelden</button>
      <button type="button" class="link" data-action="reset-pw">Passwort vergessen?</button>
    </form>
  </div>
</main>

<!-- ===================== OS ===================== -->
<div id="os" hidden>
  <header id="statusbar">
    <div class="sb-left"><span class="brand">CoinOS</span><span id="clock" class="muted"></span></div>
    <div class="sb-right">
      <div class="coin-pill" id="coinPill" title="Dein Kontostand"><i class="coin"></i><b id="sbCoins">0</b></div>
      <div id="profileWrap">
        <button class="avatar-btn" id="avatarBtn" data-action="toggle-profile" aria-label="Profil öffnen"></button>
        <div id="profileMenu" hidden>
          <div class="pm-name" id="pmName"></div>
          <div class="muted small" id="pmMail"></div>
          <span class="badge" id="pmRole"></span>
          <button class="btn block" data-action="logout" data-icon="logout">Abmelden</button>
        </div>
      </div>
    </div>
  </header>

  <main id="desktop">
    <h1 id="greeting"></h1>
    <p id="dateLine" class="muted"></p>
    <div id="appGrid"></div>
  </main>

  <nav id="dock" aria-label="Dock"></nav>

  <section id="window" aria-hidden="true" aria-labelledby="winTitle">
    <header class="win-head">
      <button class="btn head-btn" data-action="home" data-icon="home" aria-label="Zum Homescreen">Home</button>
      <h2 id="winTitle"></h2>
      <span class="head-spacer"></span>
    </header>
    <div class="win-body" id="winBody"></div>
  </section>
</div>

<section id="gameView" hidden>
  <header class="win-head" style="--accent:#7b5cff;--accent-2:#4b33d6">
    <button class="btn head-btn" data-action="close-frame" data-icon="arrow-left">Zurück</button>
    <h2 id="gameTitle"></h2>
    <a id="gameExternal" class="btn head-btn" target="_blank" rel="noopener" data-icon="external">Im Tab öffnen</a>
    <button class="btn head-btn" data-action="frame-home" data-icon="home" aria-label="Zum Homescreen"></button>
  </header>
  <iframe id="gameFrame" title="Spiel" allow="fullscreen; gamepad; autoplay" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock allow-modals"></iframe>
</section>

<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script type="module">
/* =========================================================
   Firebase (SDK v10 über CDN) – nur Auth + Firestore
   ========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, query, where,
  orderBy, limit, onSnapshot, runTransaction, serverTimestamp, writeBatch, increment
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ---------------- KONFIGURATION ---------------- */
// WICHTIG: Hier deine Admin-E-Mail eintragen. Das Konto mit dieser Adresse wird beim
// ersten Login als Admin angelegt. Dieselbe Adresse gehört auch in die Firestore-Regeln.
const ADMIN_EMAIL = "DEINE-ADMIN-MAIL@example.com";
// Nach dem Anlegen aller Konten auf false setzen (oder in Firebase die Registrierung sperren).
// Neue Nutzer kann der Admin dann trotzdem in der Admin-App anlegen.
const ALLOW_REGISTRATION = true;
const START_BALANCE = 100;

const firebaseConfig = {
  apiKey: "AIzaSyB1cAF8dfjxu_l0oz58gR7x0q6CCV55e08",
  authDomain: "as-1e226.firebaseapp.com",
  projectId: "as-1e226",
  storageBucket: "as-1e226.firebasestorage.app",

function setAuthMode(mode) {
  authMode = (mode === "register" && ALLOW_REGISTRATION) ? "register" : "login";
  $$("#authTabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === authMode));
  $("#nameField").hidden = authMode !== "register";
  $("#authSubmit").textContent = authMode === "register" ? "Konto erstellen" : "Anmelden";
  $("#authPass").autocomplete = authMode === "register" ? "new-password" : "current-password";
  $("#authError").hidden = true;
}

$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#authEmail").value.trim();
  const pass = $("#authPass").value;
  const err = $("#authError");
  const btn = $("#authSubmit");
  err.hidden = true;
  btn.disabled = true;
  try {
    if (authMode === "register") {
      pendingName = $("#authName").value.trim();
      await createUserWithEmailAndPassword(auth, email, pass);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (ex) {
    err.textContent = errMsg(ex);
    err.hidden = false;
  } finally {
    btn.disabled = false;
  }
});

  await sendPasswordResetEmail(auth, email);

async function ensureProfile(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) return;
  const admin = (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();
  await setDoc(ref, {
    email: user.email,
    role: admin ? "admin" : "user",
    name: pendingName || user.displayName || (user.email || "").split("@")[0],
    balance: START_BALANCE,
    installedApps: [],
    ownedDesigns: [],
    usage: { date: usageDateKey(), totalSeconds: 0, appSeconds: {}, events: [] }
  });
}

/* =========================================================
   Echtzeit-Listener (onSnapshot)
   ========================================================= */
const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
const onErr = e => { console.error(e); toast(errMsg(e), "error"); };

function startListeners(user) {
  const uid = user.uid;
  unsubs.push(onSnapshot(doc(db, "users", uid), snap => {
    if (!snap.exists()) return;
    state.profile = { id: snap.id, ...snap.data() };
    if (isAdmin() && !adminSubs) startAdminListeners();
    if (!osShown) showOS();
    scheduleRender();
  }, onErr));

  unsubs.push(onSnapshot(collection(db, "items"), snap => {
    state.items = docs(snap).sort((a, b) => String(a.title).localeCompare(String(b.title), "de"));
    scheduleRender();
  }, onErr));

  unsubs.push(onSnapshot(collection(db, "apps"), snap => {
    state.apps = docs(snap).sort((a, b) => String(a.title).localeCompare(String(b.title), "de"));
    scheduleRender();
  }, onErr));

  unsubs.push(onSnapshot(collection(db, "designs"), snap => {
    state.designs = docs(snap).sort((a, b) => String(a.title).localeCompare(String(b.title), "de"));
    restoreDesign();
    scheduleRender();
  }, onErr));

  unsubs.push(onSnapshot(query(collection(db, "orders"), where("userId", "==", uid)), snap => {
    state.orders = docs(snap).sort((a, b) => tsMs(b.timestamp) - tsMs(a.timestamp));
    scheduleRender();
  }, onErr));

  unsubs.push(onSnapshot(query(collection(db, "users", uid, "transactions"), orderBy("timestamp", "desc"), limit(60)), snap => {
    state.txs = docs(snap);
    scheduleRender();
  }, onErr));
}

function startAdminListeners() {
  adminSubs = true;
  unsubs.push(onSnapshot(collection(db, "users"), snap => {
    state.allUsers = docs(snap).sort((a, b) => String(a.email).localeCompare(String(b.email)));
    scheduleRender();
  }, onErr));
  unsubs.push(onSnapshot(collection(db, "orders"), snap => {
    state.allOrders = docs(snap).sort((a, b) => tsMs(b.timestamp) - tsMs(a.timestamp));
    scheduleRender();
  }, onErr));
}

function stopListeners() {
  unsubs.forEach(u => { try { u(); } catch {} });
  unsubs = [];
  adminSubs = false;
  Object.assign(state, { items: [], apps: [], orders: [], txs: [], designs: [], allUsers: [], allOrders: [], openApp: null, shopSearch: "", shopCat: "Alle", appSearch: "", appCat: "Alle", adminTab: "users", orderFilter: "alle" });

}

const usageTimer = { last: Date.now(), running: false };
function usageDateKey(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function usageAppId(){ return state.openApp || "homescreen"; }
async function recordUsageSeconds(seconds, allowHidden=false){
  if(!state.user || seconds<=0 || (!allowHidden && document.visibilityState!=="visible")) return;
  const ref=doc(db,"users",state.user.uid), day=usageDateKey(), app=usageAppId();
  try{
    await runTransaction(db,async tx=>{
      const snap=await tx.get(ref); if(!snap.exists())return;
      const data=snap.data(); const old=data.usage||{}; const daily=old.date===day?old:{date:day,totalSeconds:0,appSeconds:{},events:[]};
      const appSeconds={...(daily.appSeconds||{})}; appSeconds[app]=(Number(appSeconds[app])||0)+seconds;
      const history={...(data.usageHistory||{})}; history[day]={totalSeconds:(Number(daily.totalSeconds)||0)+seconds,appSeconds};
      const keys=Object.keys(history).sort(); while(keys.length>14) delete history[keys.shift()];
      tx.update(ref,{usage:{...daily,totalSeconds:(Number(daily.totalSeconds)||0)+seconds,appSeconds,lastSeen:serverTimestamp()},usageHistory:history});
    });
  }catch(e){ console.debug("Usage-Tracking:",e); }
}
async function usageHeartbeat(force=false){
  const now=Date.now(), elapsed=Math.min(90,Math.max(0,Math.round((now-usageTimer.last)/1000))); usageTimer.last=now;
  if(force && elapsed>0) await recordUsageSeconds(elapsed,true); else if(elapsed>=20) await recordUsageSeconds(elapsed,false);
}
function startUsageTracking(){
  usageTimer.last=Date.now();
  const iv=setInterval(()=>{ if(document.visibilityState==="visible") usageHeartbeat(false); },30000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") usageHeartbeat(true); else usageTimer.last=Date.now(); });
  window.addEventListener("beforeunload",()=>{ usageHeartbeat(true); });
  return ()=>clearInterval(iv);
}
let stopUsageTracking=null;
async function logUsageEvent(action, detail="", appId=state.openApp||"system"){
  if(!state.user)return;
  const ref=doc(db,"users",state.user.uid), day=usageDateKey();
  try{ await runTransaction(db,async tx=>{ const snap=await tx.get(ref); if(!snap.exists())return; const data=snap.data(); const old=data.usage||{}; const daily=old.date===day?old:{date:day,totalSeconds:0,appSeconds:{},events:[]}; const events=Array.isArray(daily.events)?daily.events.slice(0,99):[]; events.unshift({action,detail,appId,at:new Date().toISOString()}); tx.update(ref,{usage:{...daily,events,lastSeen:serverTimestamp()}}); }); }catch(e){ console.debug("Activity-Log:",e); }
}
function adminUserDetails(uid){
  const u=state.allUsers.find(x=>x.id===uid); if(!u)return;
  const usage=u.usage||{}; const today=usage.date===usageDateKey()?usage:{}; const apps=today.appSeconds||{};
  const labels={homescreen:"Homescreen",konto:"Konto",shop:"Shop",appstore:"App Store",designstore:"Design Store",admin:"Admin"};
  const appRows=Object.entries(apps).sort((a,b)=>b[1]-a[1]).map(([id,sec])=>`<div class="row"><div class="grow"><b>${esc(labels[id]||state.apps.find(a=>a.id===id)?.title||id)}</b><span class="muted small">Heute</span></div><span class="pill">${Math.round(sec/60)} Min.</span></div>`).join("");

  const hist=u.usageHistory||{}; const historyRows=Object.entries(hist).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7).map(([day,v])=>`<div class="row"><div class="grow"><b>${esc(day)}</b><span class="muted small">Tagesgesamt</span></div><span class="pill">${Math.round((Number(v.totalSeconds)||0)/60)} Min.</span></div>`).join("");

let shownCoins = null;
function setCoins(n) {
  const el = $("#sbCoins");
  if (shownCoins === null || reduceMotion) {
    el.textContent = fmt(n);
  } else if (n !== shownCoins) {
    const from = shownCoins, t0 = performance.now();
    const step = t => {
      const k = Math.min(1, (t - t0) / 600);
      el.textContent = fmt(Math.round(from + (n - from) * (1 - Math.pow(1 - k, 3))));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    const pill = $("#coinPill");
    pill.classList.remove("bump");
    void pill.offsetWidth;
    pill.classList.add("bump");
  }
  shownCoins = n;
}

function getInstalledApps() {
  const list = Array.isArray(state.profile?.installedApps) ? state.profile.installedApps : [];
  return list.map(x => typeof x === "string" ? { appId: x } : x).filter(x => x && x.appId);
}

function installedEntry(id) { return getInstalledApps().find(x => x.appId === id) || null; }
function appPrice(a) { return Math.max(0, Math.floor(Number(a.price ?? a.requiredCoins) || 0)); }
function appBilling(a) { return ["once","daily","weekly"].includes(a.billing) ? a.billing : "once"; }
function billingLabel(a) { return appBilling(a) === "daily" ? "pro Tag" : appBilling(a) === "weekly" ? "pro Woche" : "einmalig"; }
function entryExpiry(entry) {
  if (!entry?.expiresAt) return null;
  return entry.expiresAt?.toMillis ? entry.expiresAt.toMillis() : new Date(entry.expiresAt).getTime();
}
function isAppActive(a) {
  const e = installedEntry(a.id);
  if (!e) return false;
  const exp = entryExpiry(e);
  return !exp || exp > Date.now();
}

function openApp(id) {

  body.innerHTML = "";

  root.removeProperty("--accent");
  root.removeProperty("--accent-2");
  const w = $("#window");
  w.classList.remove("open");

async function spendCoins(amount, description, type) {
  const uid = state.user.uid;

  await runTransaction(db, async tx => {

async function buyFlow(itemId) {
  const it = state.items.find(i => i.id === itemId);
  if (!it) throw new AppError("Dieser Artikel existiert nicht mehr.");
  const price = Number(it.price) || 0;
  const bal = Number(state.profile?.balance) || 0;
  if ((Number(it.stock) || 0) <= 0) throw new AppError("Ausverkauft.");
  if (bal < price) throw new AppError(`Nicht genügend Coins. Dir fehlen noch ${fmt(price - bal)}.`);
  const ok = await confirmDialog({
    title: `${it.title} kaufen?`,
    text: `Der Kauf kostet ${fmt(price)} Coins. Danach hast du noch ${fmt(bal - price)} Coins.`,
    confirmLabel: "Jetzt kaufen"
  });
  if (!ok) return;
  await buyItem(itemId);
  toast(`${it.title} ist bestellt.`, "success");
  logUsageEvent("Shop-Kauf", `${it.title} · ${fmt(price)} Coins`, "shop");
}

async function buyItem(itemId) {
  const uid = state.user.uid;
  const userRef = doc(db, "users", uid);
  const itemRef = doc(db, "items", itemId);
  const orderRef = doc(collection(db, "orders"));
  const txRef = doc(collection(db, "users", uid, "transactions"));
  await runTransaction(db, async tx => {
    const [u, i] = await Promise.all([tx.get(userRef), tx.get(itemRef)]);
    if (!i.exists()) throw new AppError("Dieser Artikel existiert nicht mehr.");
    const item = i.data();
    const stock = Number(item.stock) || 0;
    const price = Number(item.price) || 0;
    const bal = Number(u.data()?.balance) || 0;
    if (stock <= 0) throw new AppError("Ausverkauft.");
    if (bal < price) throw new AppError("Nicht genügend Coins.");
    tx.update(userRef, { balance: bal - price });
    tx.update(itemRef, { stock: stock - 1 });
    tx.set(orderRef, { userId: uid, itemId, itemTitle: item.title, price, timestamp: serverTimestamp(), status: "bestellt" });
    tx.set(txRef, { amount: -price, type: "purchase", description: `Kauf: ${item.title}`, timestamp: serverTimestamp() });
  });
}

async function installApp(id) {
  const a = state.apps.find(x => x.id === id); if (!a) throw new AppError("Diese App gibt es nicht mehr.");
  const price = appPrice(a), billing = appBilling(a), uid = state.user.uid, userRef = doc(db,"users",uid), txRef = doc(collection(db,"users",uid,"transactions"));
  const current = installedEntry(id);
  if (current && isAppActive(a)) return toast("Diese App ist bereits installiert.");
  const ok = await confirmDialog({title:`${a.title} installieren?`, text: price > 0 ? `Die Installation kostet ${fmt(price)} Coins ${billingLabel(a)}.` : "Die Installation ist kostenlos.", confirmLabel: price > 0 ? `Für ${fmt(price)} Coins installieren` : "Kostenlos installieren"});
  if (!ok) return;
  await runTransaction(db, async tx => {
    const u = await tx.get(userRef); if (!u.exists()) throw new AppError("Nutzer nicht gefunden.");
    const data = u.data(); const bal = Number(data.balance)||0; if (bal < price) throw new AppError(`Nicht genügend Coins. Dir fehlen ${fmt(price-bal)} Coins.`);
    const list = Array.isArray(data.installedApps) ? data.installedApps.map(x => typeof x === "string" ? {appId:x}:x).filter(Boolean) : [];
    const now = Date.now(); let expiresAt = null; if (billing === "daily") expiresAt = new Date(now + 86400000); if (billing === "weekly") expiresAt = new Date(now + 7*86400000);
    const entry = {appId:id, installedAt:new Date(now), expiresAt}; const next = list.filter(x => x.appId !== id); next.push(entry);
    tx.update(userRef,{balance:bal-price,installedApps:next});
    if (price > 0) tx.set(txRef,{amount:-price,type:"app_install",description:`App ${billing === "once" ? "gekauft" : "Abo bezahlt"}: ${a.title}`,timestamp:serverTimestamp()});
  });
  toast(price > 0 ? `${a.title} wurde installiert.` : `${a.title} wurde kostenlos installiert.`,"success");
  logUsageEvent("App installiert", `${a.title}${price > 0 ? ` · ${fmt(price)} Coins` : " · kostenlos"}`, "appstore");
}
async function uninstallApp(id) {
  const a = state.apps.find(x => x.id === id); if (!a) return;
  if (!await confirmDialog({title:`${a.title} deinstallieren?`,text:"Die App verschwindet von deinem Homescreen. Ein bereits bezahlter Zeitraum wird nicht erstattet.",confirmLabel:"Deinstallieren",danger:true})) return;
  const ref=doc(db,"users",state.user.uid); const snap=await getDoc(ref); if(!snap.exists()) return;
  const next=(Array.isArray(snap.data().installedApps)?snap.data().installedApps:[]).map(x=>typeof x==="string"?{appId:x}:x).filter(x=>x.appId!==id);
  await updateDoc(ref,{installedApps:next}); toast("App deinstalliert.","success");
  logUsageEvent("App deinstalliert", a.title, "appstore");
}
async function moveInstalledApp(id, direction) {
  const ref=doc(db,"users",state.user.uid); const snap=await getDoc(ref); if(!snap.exists()) return;
  const list=(Array.isArray(snap.data().installedApps)?snap.data().installedApps:[]).map(x=>typeof x==="string"?{appId:x}:x).filter(Boolean);
  const i=list.findIndex(x=>x.appId===id); if(i<0) return; const j=i+direction; if(j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]]; await updateDoc(ref,{installedApps:list});
}

function openInstalledApp(id) {
  const a=state.apps.find(x=>x.id===id); if(!a) return;
  if(!isAppActive(a)){ toast("Das Abo dieser App ist abgelaufen. Verlängere es im App Store.","error"); openApp("appstore"); return; }
  const url=safeUrl(a.targetUrl); if(!url) throw new AppError("Für diese App ist keine gültige Adresse hinterlegt.");
  const w=window.open(url,"_blank","noopener"); if(!w) toast("Der Browser hat den neuen Tab blockiert. Bitte Pop-ups erlauben.","error");
  logUsageEvent("Externe App geöffnet", a.title, a.id);
}

    const u=await tx.get(userRef); if(!u.exists())throw new AppError("Nutzer nicht gefunden.");

async function compressDesignFile(file) {
  if (!file || !file.type.startsWith("image/")) throw new AppError("Bitte eine Bilddatei auswählen.");
  if (file.size > 8*1024*1024) throw new AppError("Das Bild darf vor der Komprimierung höchstens 8 MB groß sein.");
  const url=URL.createObjectURL(file);
  try {
    const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new AppError("Das Bild konnte nicht gelesen werden."));i.src=url;});
    const max=1600, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.naturalWidth*scale)); c.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height);
    const data= c.toDataURL("image/jpeg",0.72);
    if(data.length>900000) throw new AppError("Das Bild ist auch nach der Komprimierung noch zu groß. Bitte ein einfacheres Bild verwenden.");
    return data;
  } finally { URL.revokeObjectURL(url); }
}

async function adjustCoins(uid, delta, reason) {
  const ref = doc(db, "users", uid);
  const txRef = doc(collection(db, "users", uid, "transactions"));
  await runTransaction(db, async tx => {
    const s = await tx.get(ref);
    if (!s.exists()) throw new AppError("Nutzer nicht gefunden.");
    const bal = Number(s.data().balance) || 0;
    if (bal + delta < 0) throw new AppError(`Das Guthaben kann nicht unter 0 fallen (aktuell ${fmt(bal)} Coins).`);
    tx.update(ref, { balance: bal + delta });
    tx.set(txRef, { amount: delta, type: "admin", description: reason || (delta > 0 ? "Gutschrift vom Admin" : "Abzug vom Admin"), timestamp: serverTimestamp() });
  });
}

   Modal & Toast
   ========================================================= */
let modalCloseCb = null;

function fieldHTML(f) {
  if (f.type === "file") return `<label class="field"><span>${esc(f.label)}</span><input name="${f.name}" type="file" accept="image/*" ${f.required ? "required" : ""}></label>`;
  if (f.type === "checkbox") return `<label class="check"><input type="checkbox" name="${f.name}" ${f.value ? "checked" : ""}><span>${esc(f.label)}</span></label>`;
  if (f.type === "select") return `<label class="field"><span>${esc(f.label)}</span><select name="${f.name}">${f.options.map(o => `<option value="${esc(o.value)}" ${o.value === f.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select></label>`;
  const num = f.type === "number" ? `min="${f.min ?? 0}" step="${f.step ?? 1}"` : "";
  return `<label class="field"><span>${esc(f.label)}</span><input name="${f.name}" type="${f.type || "text"}" value="${esc(f.value ?? "")}" placeholder="${esc(f.placeholder || "")}" ${num} ${f.required ? "required" : ""} autocomplete="off"></label>`;
}

function readForm(form, fields) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.name];
    if (f.type === "checkbox") out[f.name] = el.checked;
    else if (f.type === "number") out[f.name] = Number(el.value);
    else if (f.type === "file") out[f.name] = el.files?.[0] || null;
    else out[f.name] = el.value.trim();
  }
  return out;
}

function showModal({ title, text = "", fields = [], submitLabel = "Speichern", danger = false, onSubmit, onClose }) {
  closeModal();
  modalCloseCb = onClose || null;
  $("#modalRoot").innerHTML = `
    <div class="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <h3>${esc(title)}</h3>
        ${text ? `<p class="muted modal-text">${esc(text)}</p>` : ""}
        <form id="modalForm">
          ${fields.map(fieldHTML).join("")}
          <p class="form-error" id="modalError" hidden></p>
          <div class="modal-actions">
            <button type="button" class="btn ghost" data-action="close-modal">Abbrechen</button>
            <button type="submit" class="btn ${danger ? "danger" : "primary"}">${esc(submitLabel)}</button>
          </div>
        </form>
      </div>
    </div>`;
  const form = $("#modalForm");
  const first = form.querySelector("input,select");
  (first || form.querySelector("button[type=submit]")).focus();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    try {
      await onSubmit(readForm(form, fields));
      closeModal();
    } catch (ex) {
      console.error(ex);
      const box = $("#modalError");
      if (box) { box.textContent = errMsg(ex); box.hidden = false; }
      btn.disabled = false;
    }
  });
}

function closeModal() {
  const root = $("#modalRoot");
  if (!root || !root.innerHTML) return;
  root.innerHTML = "";
  const cb = modalCloseCb;
  modalCloseCb = null;
  if (cb) cb();
}

function confirmDialog({ title, text, confirmLabel = "Bestätigen", danger = false }) {
  return new Promise(resolve => {
    let done = false;
    showModal({
      title, text, submitLabel: confirmLabel, danger,
      onSubmit: async () => { done = true; resolve(true); },
      onClose: () => { if (!done) resolve(false); }
    });
  });
}

function toast(msg, type = "info") {
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), type === "error" ? 5500 : 3200);
}

  "user-new": userNewDialog,
  "item-new": () => itemDialog(),
  "item-edit": el => itemDialog(el.dataset.id),
  "item-del": el => itemDelete(el.dataset.id),
  "seed": seedItems,
  "app-new": () => appDialog(),
  "app-edit": el => appDialog(el.dataset.id),
  "app-del": el => appDelete(el.dataset.id),
  "design-new": () => designDialog(),
  "design-edit": el => designDialog(el.dataset.id),
  "design-del": el => designDelete(el.dataset.id),
  "order-filter": el => { state.orderFilter = el.dataset.status; updateAdmin(); }
};

document.addEventListener("click", async e => {
  const menu = $("#profileMenu");
  if (menu && !menu.hidden && !e.target.closest("#profileWrap")) menu.hidden = true;
  if (e.target.classList?.contains("modal-backdrop")) return closeModal();
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (!fn) return;
  try { await fn(el); }
  catch (err) { console.error(err); toast(errMsg(err), "error"); }
});

document.addEventListener("change", async e => {
  const el = e.target.closest("[data-change]");
  if (!el || el.dataset.change !== "order-status") return;
  try {
    await updateDoc(doc(db, "orders", el.dataset.id), { status: el.value });
    toast("Status aktualisiert.", "success");
  } catch (err) {
    console.error(err);
    toast(errMsg(err), "error");
  }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#modalRoot").innerHTML) closeModal();
  else if (!$("#gameView").hidden) closeGameFrame();
  else if (state.openApp) closeApp();
});

/* ---------------- Start ---------------- */
$$("[data-icon]").forEach(el => el.insertAdjacentHTML("afterbegin", icon(el.dataset.icon, 18)));
if (!ALLOW_REGISTRATION) $("#registerTab").hidden = true;
setAuthMode("login");
stopUsageTracking=startUsageTracking();
</script>
</body>
</html>
